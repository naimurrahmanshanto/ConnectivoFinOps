<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connectivo FinOps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#FAFBFC; --border:#E3E7EC; --border-strong:#CDD4DC;
  --ink:#151B23; --ink-soft:#57616D; --ink-faint:#8993A0;
  --sidebar-bg:#12181F; --sidebar-bg-2:#1B222C;
  --primary-900:#0A3D5C; --primary-700:#0E6BA8; --primary-600:#1479BE; --primary-500:#2196D3; --primary-300:#7ED4EC; --primary-100:#E7F5FB;
  --success:#1C7A50; --success-bg:#E8F5EE; --danger:#B23A2E; --danger-bg:#FBEAE8; --warning:#9A6A11; --warning-bg:#FBF1DF; --info:#2196D3; --info-bg:#E7F5FB;
  --radius:6px; --radius-lg:10px;
  --shadow-1:0 1px 2px rgba(15,23,31,.06); --shadow-2:0 4px 16px rgba(15,23,31,.08);
  --sidebar-w:248px;
  color-scheme: light;
}
:root:not([data-theme="light"]){ }
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
body[data-theme="dark"], body{ background:var(--bg); color:var(--ink); }
h1,h2,h3,h4{font-family:'Inter Tight','Inter',sans-serif; margin:0; letter-spacing:-0.01em;}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--primary-300); color:var(--primary-900);}

/* ---- layout ---- */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w); background:var(--sidebar-bg); color:#DCEBF4;
  position:sticky; top:0; align-self:flex-start; height:100vh; overflow-y:auto;
  padding:20px 14px 20px; display:flex; flex-direction:column;
  padding-top:calc(20px + env(safe-area-inset-top,0px));
}
.sidebar-brand{display:flex; align-items:center; gap:11px; padding:2px 6px 20px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:14px;}
.sidebar-brand img{height:36px; width:auto; flex:0 0 auto; display:block;}
.sidebar-brand .brandtext{font-family:'Inter Tight'; font-weight:800; font-size:15.5px; color:#fff; line-height:1.2; letter-spacing:.01em;}
.sidebar-brand .brandtext small{display:block; font-weight:500; font-size:10px; color:#8CA3B8; letter-spacing:.02em; margin-top:1px;}
.navgroup{margin-bottom:4px;}
.navgroup-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:#6E9CB6; padding:14px 10px 6px; font-weight:600;}
.navlink{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--radius);
  color:#C7DFEC; text-decoration:none; font-size:13.5px; font-weight:500; cursor:pointer; margin-bottom:1px;
  border:none; background:none; width:100%; text-align:left;
}
.navlink svg{width:16px; height:16px; flex:0 0 16px; opacity:.85;}
.navlink:hover{background:rgba(255,255,255,.07); color:#fff;}
.navlink.active{background:var(--primary-600); color:#fff;}
.sidebar-foot{margin-top:auto; padding-top:12px; border-top:1px solid rgba(255,255,255,.12);}
.role-pill{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; color:#9FC4DB; padding:2px 0;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--primary-300);}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:14px; padding:12px 22px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
}
.topbar h1{font-size:16px; font-weight:700;}
.topbar .sub{color:var(--ink-soft); font-size:12.5px; margin-top:1px;}
.topbar-spacer{flex:1;}
.searchbox{position:relative;}
.searchbox input{
  width:230px; padding:7px 10px 7px 30px; border:1px solid var(--border-strong); border-radius:var(--radius);
  font-size:13px; background:var(--surface-2); color:var(--ink);
}
.searchbox svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--ink-faint);}
.content{padding:22px; max-width:1360px; width:100%; margin:0 auto;}
.viewport-narrow{overflow-x:auto;}

/* ---- primitives ---- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-1);}
.card-pad{padding:18px 20px;}
.card-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px 0;}
.card-title{font-size:13.5px; font-weight:700;}
.card-title-sm{font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:none;}
.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1080px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(1,1fr);}}
@media (max-width:640px){.grid-4,.grid-2{grid-template-columns:1fr;}}

.metric{padding:16px 18px;}
.metric svg{width:14px; height:14px;}
.metric .label{font-size:12px; color:var(--ink-soft); font-weight:600;}
.metric .val{font-family:'Inter Tight'; font-size:24px; font-weight:800; margin-top:6px;}
.metric .delta{font-size:11.5px; margin-top:6px; font-weight:600;}
.metric .delta.up{color:var(--success);}
.metric .delta.down{color:var(--danger);}
.metric .delta.flat{color:var(--ink-faint);}

.btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:var(--radius);
  font-size:13px; font-weight:600; border:1px solid transparent; cursor:pointer; white-space:nowrap;
}
.btn-primary{background:var(--primary-700); color:#fff;}
.btn-primary:hover{background:var(--primary-600);}
.btn-ghost{background:transparent; border-color:var(--border-strong); color:var(--ink);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:var(--danger-bg); color:var(--danger); border-color:#EFC9C4;}
.btn-sm{padding:5px 10px; font-size:12px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-icon{width:30px;height:30px;padding:0;justify-content:center;}

table{border-collapse:collapse; width:100%; font-size:13px;}
th{
  text-align:left; font-size:11px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em;
  padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap;
}
td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--surface-2);}
.right{text-align:right;}
.mono-amt{font-variant-numeric:tabular-nums; font-weight:600;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600;}
.badge-recorded{background:var(--info-bg); color:var(--primary-700);}
.badge-voided{background:var(--danger-bg); color:var(--danger); text-decoration:line-through;}
.badge-draft{background:var(--warning-bg); color:var(--warning);}
.badge-income{background:var(--success-bg); color:var(--success);}
.badge-expense{background:var(--danger-bg); color:var(--danger);}
.badge-transfer{background:var(--info-bg); color:var(--primary-700);}
.badge-locked{background:#EEF0F3; color:var(--ink-soft);}

.field{margin-bottom:13px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; padding:8px 10px; border:1px solid var(--border-strong); border-radius:var(--radius);
  font-size:13.5px; font-family:inherit; background:var(--surface); color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--primary-300); outline-offset:0; border-color:var(--primary-500);}
.field .hint{font-size:11px; color:var(--ink-faint); margin-top:4px;}
.field .err{font-size:11.5px; color:var(--danger); margin-top:4px; font-weight:600;}
.field.has-err input, .field.has-err select{border-color:var(--danger);}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.form-section-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); margin:18px 0 10px; padding-top:14px; border-top:1px solid var(--border);}
.form-section-label:first-child{margin-top:0; padding-top:0; border-top:none;}

.modal-overlay{position:fixed; inset:0; background:rgba(15,23,31,.45); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;}
.modal{background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:560px; box-shadow:var(--shadow-2); margin-bottom:40px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:15px;}
.modal-body{padding:20px 22px;}
.modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:16px 22px; border-top:1px solid var(--border);}
.modal-close{background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:18px; line-height:1; padding:4px;}

.empty{text-align:center; padding:48px 20px; color:var(--ink-soft);}
.empty h3{font-size:14px; margin-bottom:6px; color:var(--ink);}
.empty p{font-size:13px; margin-bottom:16px;}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:18px;}
.tab{padding:9px 4px; margin-right:20px; font-size:13px; font-weight:600; color:var(--ink-soft); border-bottom:2px solid transparent; cursor:pointer; background:none; border-top:none; border-left:none; border-right:none;}
.tab.active{color:var(--primary-700); border-bottom-color:var(--primary-700);}

.filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.filters select, .filters input{padding:6px 9px; border:1px solid var(--border-strong); border-radius:var(--radius); font-size:12.5px; background:var(--surface);}

.toast-wrap{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--ink); color:#fff; padding:11px 16px; border-radius:var(--radius); font-size:13px; box-shadow:var(--shadow-2); max-width:340px;}
.toast.error{background:var(--danger);}
.toast.success{background:var(--success);}

.pagination{display:flex; align-items:center; justify-content:space-between; padding-top:12px; font-size:12.5px; color:var(--ink-soft);}
.pagination .btns{display:flex; gap:6px;}

.lockbar{display:flex; align-items:center; gap:8px; background:var(--warning-bg); color:var(--warning); padding:9px 14px; border-radius:var(--radius); font-size:12.5px; font-weight:600; margin-bottom:16px;}

.kv{display:grid; grid-template-columns:130px 1fr; gap:8px 14px; font-size:13px;}
.kv dt{color:var(--ink-soft); font-weight:600;}
.kv dd{margin:0;}

.divider{height:1px; background:var(--border); margin:16px 0;}
.progress-track{height:6px; border-radius:4px; background:var(--border); overflow:hidden;}
.progress-fill{height:100%; background:var(--primary-500);}

.loading-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; color:var(--ink-soft);}
.spinner{width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--primary-600); border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.gate{max-width:420px; margin:80px auto; text-align:center;}
.gate img{height:40px; margin-bottom:18px;}

@media (max-width:900px){
  .sidebar{position:fixed; z-index:50; transform:translateX(-100%); transition:transform .18s ease; box-shadow:var(--shadow-2);}
  .sidebar.open{transform:translateX(0);}
  .main{width:100%;}
  .content{padding:16px;}
  .topbar{padding:10px 14px;}
  .searchbox input{width:140px;}
}
.hamburger{display:none; background:none; border:1px solid var(--border-strong); border-radius:var(--radius); width:34px; height:34px; align-items:center; justify-content:center; cursor:pointer;}
@media (max-width:900px){.hamburger{display:flex;} .topbar-mark{display:block !important;}}
.overlay-scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40;}
.overlay-scrim.show{display:block;}

.icon-btn{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:6px;border-radius:var(--radius);}
.icon-btn:hover{background:var(--surface-2); color:var(--ink);}
</style>
</head>

/* ---------------- small utils ---------------- */
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n, cur='BDT') => {
  // Plain "BDT" prefix everywhere (website and PDFs) — the Bengali Taka
  // glyph (৳) isn't in jsPDF's standard fonts and rendered as a broken/
  // missing glyph on vouchers and statements, so we don't use it at all.
  const v = Number(n||0);
  const s = v.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  return (cur||'BDT') + ' ' + s;
};
const signedMoney = (n, cur='BDT') => (n<0? '−':'') + money(Math.abs(n),cur);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = iso => { if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtDateTime = iso => { if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); };
const monthLabel = ym => { const [y,m]=ym.split('-'); return new Date(Number(y),Number(m)-1,1).toLocaleDateString('en-GB',{month:'short',year:'numeric'}); };
const uuid = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

function toast(msg, kind){
  const wrap = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (kind?(' '+kind):'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 3600);
}

/* ---------------- global state ---------------- */
const S = {
  mode: 'claude', // 'claude' (running inside a claude.ai artifact) | 'local' (self-hosted, e.g. Netlify/GitHub Pages)
  db: null, userCap: null, uid: null, isOwner:false,

  accounts:[], categories:[], businessUnits:[], transactions:[], auditLogs:[], roles:[],
  ready:false, route:'#/dashboard',

  reportPeriod:'this_month',
};

/* ---------------- db helpers ---------------- */
async function dbList(col){
  try{
    const r = await S.db.collection(col).limit(1000).get();
    // NOTE: DocumentSnapshot.data is a METHOD, not a property — must be called.
    return (r && r.docs) ? r.docs.filter(d=>d.exists).map(d=>({id:d.id, ...(d.data()||{})})) : [];
  }catch(e){ console.error('dbList',col,e); return []; }
}
async function dbSet(col,id,data){ return S.db.doc(col+'/'+id).set(data); }
async function dbUpdate(col,id,data){ return S.db.doc(col+'/'+id).update(data); }
async function dbDelete(col,id){ return S.db.doc(col+'/'+id).delete(); }
async function dbGetDoc(col,id){
  try{
    const d = await S.db.doc(col+'/'+id).get();
    if(!d || !d.exists) return null;
    return {id:d.id, ...(d.data()||{})};
  }catch(e){ return null; }
}

async function logAudit(action, objectType, objectId, summary, actorNameOverride){
  const id = uuid();
  try{
    await dbSet('auditLogs', id, {
      action, objectType, objectId: objectId||'', summary: summary||'',
      userId: S.uid||'unknown', userName: actorNameOverride || S.me.name || 'Unknown user',
      at: new Date().toISOString(),
    });
  }catch(e){ console.error('audit failed', e); }
}

/* ---------------- financial calculation service (single source of truth) ---------------- */
function effectOnAccount(tx, accountId){
  if(tx.status==='voided') return {income:0,expense:0,tin:0,tout:0};
  if(tx.type==='income' && tx.accountId===accountId) return {income:Number(tx.amount)||0,expense:0,tin:0,tout:0};
  if(tx.type==='expense' && tx.accountId===accountId) return {income:0,expense:Number(tx.amount)||0,tin:0,tout:0};
  if(tx.type==='transfer'){
    if(tx.accountId===accountId) return {income:0,expense:0,tin:0,tout:Number(tx.amount)||0};
    if(tx.toAccountId===accountId) return {income:0,expense:0,tin:Number(tx.amount)||0,tout:0};
  }
  return {income:0,expense:0,tin:0,tout:0};
}
const FinancialService = {
  balances(accounts, transactions, from, to){
    return accounts.map(acc=>{
      let opening = Number(acc.openingBalance||0);
      let income=0, expense=0, tin=0, tout=0;
      transactions.forEach(tx=>{
        if(tx.status==='voided') return;
        const e = effectOnAccount(tx, acc.id);
        if(!(e.income||e.expense||e.tin||e.tout)) return;
        if(from && tx.date < from){ opening += (e.income - e.expense + e.tin - e.tout); return; }
        if(to && tx.date > to) return;
        income+=e.income; expense+=e.expense; tin+=e.tin; tout+=e.tout;
      });
      return {account:acc, opening, income, expense, transfersIn:tin, transfersOut:tout, closing: opening+income-expense+tin-tout};
    });
  },
  totals(accounts, transactions, from, to){
    const rows = this.balances(accounts, transactions, from, to);
    return rows.reduce((a,r)=>({
      opening:a.opening+r.opening, income:a.income+r.income, expense:a.expense+r.expense,
      transfersIn:a.transfersIn+r.transfersIn, transfersOut:a.transfersOut+r.transfersOut, closing:a.closing+r.closing
    }),{opening:0,income:0,expense:0,transfersIn:0,transfersOut:0,closing:0});
  },
  incomeInRange(transactions, from, to){
    return transactions.filter(t=>t.type==='income' && t.status!=='voided' && (!from||t.date>=from) && (!to||t.date<=to))
      .reduce((s,t)=>s+Number(t.amount||0),0);
  },
  expenseInRange(transactions, from, to){
    return transactions.filter(t=>t.type==='expense' && t.status!=='voided' && (!from||t.date>=from) && (!to||t.date<=to))
      .reduce((s,t)=>s+Number(t.amount||0),0);
  },
  byCategory(transactions, categories, kind, from, to){
    const map = new Map();
    transactions.filter(t=>t.type===kind && t.status!=='voided' && (!from||t.date>=from) && (!to||t.date<=to)).forEach(t=>{
      const c = categories.find(c=>c.id===t.categoryId);
      const name = c ? c.name : 'Uncategorized';
      map.set(name, (map.get(name)||0) + Number(t.amount||0));
    });
    return Array.from(map.entries()).map(([name,amount])=>({name,amount})).sort((a,b)=>b.amount-a.amount);
  },
  byBusinessUnit(transactions, units, kind, from, to){
    const map = new Map();
    transactions.filter(t=>t.type===kind && t.status!=='voided' && (!from||t.date>=from) && (!to||t.date<=to)).forEach(t=>{
      const u = units.find(u=>u.id===t.businessUnitId);
      const name = u ? u.name : 'Unassigned';
      map.set(name, (map.get(name)||0) + Number(t.amount||0));
    });
    return Array.from(map.entries()).map(([name,amount])=>({name,amount})).sort((a,b)=>b.amount-a.amount);
  },
  monthlySeries(transactions, months){
    const out = [];
    const now = new Date();
    for(let i=months-1;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const ym = d.toISOString().slice(0,7);
      const from = ym+'-01', to = ym+'-31';
      out.push({ym, income:this.incomeInRange(transactions,from,to), expense:this.expenseInRange(transactions,from,to)});
    }
    return out;
  },
  pctChange(curr, prev){
    if(prev===0) return null;
    return ((curr-prev)/prev)*100;
  }
};

/* ---------------- period helper ---------------- */
function periodRange(key){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const pad = n=>String(n).padStart(2,'0');
  const iso = d => d.toISOString().slice(0,10);
  if(key==='this_month'){ return {from: `${y}-${pad(m+1)}-01`, to: iso(new Date(y,m+1,0)), label:'This Month'}; }
  if(key==='last_3'){ const s=new Date(y,m-2,1); return {from:iso(s), to: iso(new Date(y,m+1,0)), label:'Last 3 Months'}; }
  if(key==='last_6'){ const s=new Date(y,m-5,1); return {from:iso(s), to: iso(new Date(y,m+1,0)), label:'Last 6 Months'}; }
  if(key==='this_year'){ return {from:`${y}-01-01`, to:`${y}-12-31`, label:'Current Year'}; }
  if(key==='last_year'){ return {from:`${y-1}-01-01`, to:`${y-1}-12-31`, label:'Previous Year'}; }
  return {from:null, to:null, label:'All Time'};
}
function prevPeriodRange(key){
  const r = periodRange(key);
  if(!r.from) return {from:null,to:null};
  const from = new Date(r.from), to = new Date(r.to);
  const days = Math.round((to-from)/86400000)+1;
  const prevTo = new Date(from.getTime()-86400000);
  const prevFrom = new Date(prevTo.getTime()-(days-1)*86400000);
  const iso = d=>d.toISOString().slice(0,10);
  return {from:iso(prevFrom), to:iso(prevTo)};
}

/* ---------------- voucher numbering (best-effort unique; see note) ---------------- */
async function nextVoucher(type){
  const prefix = {income:'INC', expense:'EXP', transfer:'TRF'}[type];
  const year = new Date().getFullYear();
  const key = `${prefix}_${year}`;
  // Best-effort sequential numbering: the runtime db has no server-side
  // transactions/atomic counters, so this is read-then-write (a genuine
  // simultaneous save from two people could in theory collide). We take
  // the higher of the shared counter and the count already visible in
  // the loaded ledger, which self-heals if the counter doc ever drifts.
  const localCount = 1 + S.transactions.filter(t=>t.voucher && t.voucher.startsWith(prefix+'-'+year+'-')).length;
  let n = localCount;
  try{
    const doc = await dbGetDoc('counters','voucher');
    const data = doc ? {...doc} : {};
    delete data.id;
    const counterNext = (Number(data[key])||0) + 1;
    n = Math.max(counterNext, localCount);
    data[key] = n;
    await dbSet('counters','voucher', data);
  }catch(e){
    console.error('voucher counter write failed, using ledger-derived number', e);
  }
  return `${prefix}-${year}-${String(n).padStart(5,'0')}`;
}

/* ---------------- seed defaults (owner only, first run) ---------------- */
async function seedIfEmpty(){
  // Any signed-in collaborator has write access to shared data by default,
  // not only the artifact owner — gating this on isOwner() left every
  // non-owner viewer with empty categories/accounts. Try it whenever the
  // ledger looks empty; a viewer without write access simply fails
  // silently and the next writer to open the page seeds it instead.
  const writes = [];
  // Check income and expense presets independently — an interrupted or
  // partial earlier seed could leave one kind populated and the other
  // empty, and `categories.length===0` alone would never re-check that.
  const hasIncomeCats = S.categories.some(c=>c.kind==='income');
  const hasExpenseCats = S.categories.some(c=>c.kind==='expense');
  if(!hasIncomeCats){
    CFG.incomeCategories.forEach(([name,group])=> writes.push({op:'set', collection:'categories', doc_id:uuid(), data:{name,group,kind:'income',active:true}}));
  }
  if(!hasExpenseCats){
    CFG.expenseCategories.forEach(([name,group])=> writes.push({op:'set', collection:'categories', doc_id:uuid(), data:{name,group,kind:'expense',active:true}}));
  }
  if(S.businessUnits.length===0){
    CFG.businessUnits.forEach(name=> writes.push({op:'set', collection:'businessUnits', doc_id:uuid(), data:{name, active:true}}));
  }
  if(S.accounts.length===0){
    CFG.accounts.forEach(a=> writes.push({op:'set', collection:'accounts', doc_id:uuid(), data:{...a, currency:'BDT', active:true}}));
  }
  if(writes.length){
    try{
      for(const w of writes){ await S.db.doc(w.collection+'/'+w.doc_id).set(w.data); }
      await logAudit('SYSTEM_SEEDED','system','', 'Default categories, business units and accounts created.');
      await refetchAll();
    }catch(e){ console.error('seed failed (likely a read-only viewer); another collaborator with write access will seed it', e); }
  }
}

/* ---------------- data fetch ---------------- */
async function refetchAll(){
  const [accounts, categories, businessUnits, transactions, auditLogs, roles] = await Promise.all([
    dbList('accounts'), dbList('categories'), dbList('businessUnits'), dbList('transactions'), dbList('auditLogs'), dbList('roles')
  ]);
  S.accounts = accounts.filter(a=>a.active!==false).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  S.categories = categories.sort((a,b)=>(a.group||'').localeCompare(b.group||'')||(a.name||'').localeCompare(b.name||''));
  S.businessUnits = businessUnits.filter(b=>b.active!==false);
  S.transactions = transactions.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.createdAt||'').localeCompare(a.createdAt||''));
  S.auditLogs = auditLogs.sort((a,b)=> (b.at||'').localeCompare(a.at||''));
  // NOTE: `roles` here is only ever a per-account STATUS record
  // (active/suspended) plus display metadata — never the source of
  // truth for role. Role is decided once, at login, from the fixed
  // ACCOUNTS credential table, and must never be re-derived from this
  // mutable, database-writable collection: doing so would let anyone
  // with ordinary write access escalate their own role by editing their
  // own roles/<uid> document.
  S.roles = roles;
}

const DONUT_PALETTE = ['#0E6BA8','#2196D3','#5FB8DB','#7ED4EC','#0A3D5C','#1479BE','#9FDCEE','#B23A2E','#9A6A11','#1C7A50'];

/** A clean SVG donut chart — used for premium-feeling infographic
 * summaries (revenue mix, expenditure mix) instead of plain bar lists. */
function svgDonut(items, {size=150, hole=0.62}={}){
  const total = items.reduce((s,i)=>s+Math.max(0,i.amount),0);
  const r = size/2, cx=r, cy=r, rInner = r*hole;
  let angle = -Math.PI/2;
  let arcs = '';
  if(total<=0){
    arcs = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--border)"/><circle cx="${cx}" cy="${cy}" r="${rInner}" fill="var(--surface)"/>`;
  } else {
    items.forEach((it,i)=>{
      const amt = Math.max(0,it.amount);
      const frac = amt/total;
      if(frac<=0) return;
      const startAngle = angle;
      const endAngle = (i===items.length-1) ? (-Math.PI/2 + Math.PI*2 - 0.0001) : angle + frac*Math.PI*2;
      angle = endAngle;
      const color = DONUT_PALETTE[i % DONUT_PALETTE.length];
      const largeArc = (endAngle-startAngle) > Math.PI ? 1 : 0;
      const x1 = cx + r*Math.cos(startAngle), y1 = cy + r*Math.sin(startAngle);
      const x2 = cx + r*Math.cos(endAngle), y2 = cy + r*Math.sin(endAngle);
      const ix1 = cx + rInner*Math.cos(endAngle), iy1 = cy + rInner*Math.sin(endAngle);
      const ix2 = cx + rInner*Math.cos(startAngle), iy2 = cy + rInner*Math.sin(startAngle);
      arcs += `<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L ${ix1.toFixed(2)} ${iy1.toFixed(2)} A ${rInner} ${rInner} 0 ${largeArc} 0 ${ix2.toFixed(2)} ${iy2.toFixed(2)} Z" fill="${color}"/>`;
    });
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block;">${arcs}</svg>`;
}

/** Donut + legend + center total, the recurring "premium infographic"
 * panel used across the dashboard and analysis reports. */
function donutPanel(items, {size=150, unit=''}={}){
  const total = items.reduce((s,i)=>s+Math.max(0,i.amount),0);

/** Filled gradient area/line chart for the income-vs-expenditure trend —
 * replaces the old plain two-line sparkline with something more premium:
 * soft gridlines, a gradient-filled income area, and a labeled axis. */
function svgAreaChart(series, w=560, h=180){
  if(!series.length) return '';
  const max = Math.max(1, ...series.map(s=>Math.max(s.income,s.expense))) * 1.12;
  const stepX = w/(series.length-1||1);
  const yFor = v => h - (v/max)*h;
  const incomePts = series.map((s,i)=>`${(i*stepX).toFixed(1)},${yFor(s.income).toFixed(1)}`).join(' ');
  const expensePts = series.map((s,i)=>`${(i*stepX).toFixed(1)},${yFor(s.expense).toFixed(1)}`).join(' ');
  const gid = 'incGrad'+Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2196D3" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#2196D3" stop-opacity="0.02"/>
      </linearGradient>
    </defs>
    ${[0.25,0.5,0.75].map(f=>`<line x1="0" y1="${(h*f).toFixed(1)}" x2="${w}" y2="${(h*f).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`).join('')}
    <polygon points="0,${h} ${incomePts} ${w},${h}" fill="url(#${gid})"/>
    <polyline points="${expensePts}" fill="none" stroke="var(--danger)" stroke-width="2" opacity="0.85" stroke-linejoin="round"/>
    <polyline points="${incomePts}" fill="none" stroke="var(--primary-600)" stroke-width="2.6" stroke-linejoin="round"/>
  </svg>`;
}

/* ================= TRANSACTIONS LIST ================= */
function applyFilters(list){
  const f = S.filters;
  return list.filter(t=>{
    if(f.type && t.type!==f.type) return false;
    if(f.category && t.categoryId!==f.category) return false;
    if(f.account && t.accountId!==f.account && t.toAccountId!==f.account) return false;
    if(f.bu && t.businessUnitId!==f.bu) return false;
    if(f.status && t.status!==f.status) return false;
    if(f.from && t.date < f.from) return false;
    if(f.to && t.date > f.to) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = [t.voucher,t.party,t.description,t.reference].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function statusBadge(s){
  const map = {recorded:'Recorded', voided:'Voided', draft:'Draft'};
  return `<span class="badge badge-${s}">${map[s]||s}</span>`;
}
function typeBadge(t){
  return `<span class="badge badge-${t}">${t.charAt(0).toUpperCase()+t.slice(1)}</span>`;
}

const SCOPE_META = {
  income:   {title:'Income',       sub:'All recorded income, filterable and exportable',              recordLabel:'Record Income'},
  expense:  {title:'Expenditure',  sub:'All recorded expenditure, filterable and exportable',          recordLabel:'Record Expenditure'},
  transfer: {title:'Transfers',    sub:"Funds moved between Connectivo's own accounts",                recordLabel:'Record Transfer'},
};

/** scopeType: null/undefined = All Transactions (every type, with a type
 * filter). 'income'|'expense'|'transfer' = a dedicated tab pre-filtered to
 * that type only — its own Add button opens the matching form directly;
 * it never falls through to the generic ledger view. */
function renderTransactions(scopeType){
  const meta = scopeType ? SCOPE_META[scopeType] : null;
  setTitle(meta? meta.title : 'All Transactions', meta? meta.sub : 'Every recorded financial event, filterable and exportable');
  if(scopeType) S.filters.type = scopeType; // lock the type filter to this tab
  else if(S.filters.scopeWasLocked) S.filters.type = ''; // returning to All Transactions clears a stale lock
  // Income and expense categories are different sets — a category filter
  // picked on one tab would otherwise silently carry over and match
  // nothing on another (looking like an empty-results bug).
  if(scopeType !== S.filters._prevScope){ S.filters.category = ''; S.filters._prevScope = scopeType || null; }
  S.filters.scopeWasLocked = !!scopeType;

  const source = scopeType ? S.transactions.filter(t=>t.type===scopeType) : S.transactions;
  const filtered = applyFilters(source);
  const pageSize = S.filters.pageSize;
  const totalPages = Math.max(1, Math.ceil(filtered.length/pageSize));
  S.filters.page = Math.min(S.filters.page, totalPages);
  const pageItems = filtered.slice((S.filters.page-1)*pageSize, S.filters.page*pageSize);

  const catOpts = S.categories.filter(c=>!scopeType || c.kind===scopeType).map(c=>`<option value="${c.id}" ${S.filters.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const accOpts = S.accounts.map(a=>`<option value="${a.id}" ${S.filters.account===a.id?'selected':''}>${esc(a.name)}</option>`).join('');
  const buOpts = S.businessUnits.map(b=>`<option value="${b.id}" ${S.filters.bu===b.id?'selected':''}>${esc(b.name)}</option>`).join('');
  const recordLabel = meta? meta.recordLabel : 'Record';
  const addType = scopeType || 'income';

  $('#content').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
      <div class="filters">
        <input id="fq" placeholder="Search…" value="${esc(S.filters.q)}" style="width:170px;">
        ${scopeType? '' : `<select id="ftype"><option value="">All types</option><option value="income" ${S.filters.type==='income'?'selected':''}>Income</option><option value="expense" ${S.filters.type==='expense'?'selected':''}>Expenditure</option><option value="transfer" ${S.filters.type==='transfer'?'selected':''}>Transfer</option></select>`}
        ${scopeType==='transfer'? '' : `<select id="fcat"><option value="">All categories</option>${catOpts}</select>`}
        <select id="facc"><option value="">All accounts</option>${accOpts}</select>
        ${scopeType==='transfer'? '' : `<select id="fbu"><option value="">All business units</option>${buOpts}</select>`}
        <select id="fstatus"><option value="">All statuses</option><option value="recorded" ${S.filters.status==='recorded'?'selected':''}>Recorded</option><option value="voided" ${S.filters.status==='voided'?'selected':''}>Voided</option></select>
        <input type="date" id="ffrom" value="${S.filters.from}">
        <input type="date" id="fto" value="${S.filters.to}">
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-ghost btn-sm" id="exportBtn">${ICONS('download')} Export CSV</button>
        <button class="btn btn-primary btn-sm" id="quickAdd">${ICONS('plus')} ${recordLabel}</button>
      </div>
    </div>
    <div class="card">
      <div class="card-pad viewport-narrow" style="padding-top:6px;">
        ${pageItems.length? `<table><thead><tr>
          <th>Date</th><th>Voucher</th>${scopeType?'':'<th>Type</th>'}<th>Description</th><th>${scopeType==='transfer'?'Accounts':'Category'}</th>${scopeType==='transfer'?'':'<th>Account</th>'}<th class="right">Amount</th><th>Status</th>
        </tr></thead><tbody>
          ${pageItems.map(t=>{
            const cat = S.categories.find(c=>c.id===t.categoryId);
            const acc = S.accounts.find(a=>a.id===t.accountId);
            const toAcc = S.accounts.find(a=>a.id===t.toAccountId);
            return `<tr data-tx="${t.id}">
              <td>${fmtDate(t.date)}</td>
              <td style="font-weight:600;">${esc(t.voucher)}</td>
              ${scopeType?'':'<td>'+typeBadge(t.type)+'</td>'}
              <td>${esc(t.party||t.description||'—')}</td>
              <td>${t.type==='transfer'? esc((acc?acc.name:'—')+' → '+(toAcc?toAcc.name:'—')) : esc(cat?cat.name:'Uncategorized')}</td>
              ${scopeType==='transfer'?'':'<td>'+esc(acc?acc.name:'—')+'</td>'}
              <td class="right mono-amt" style="color:${t.type==='expense'?'var(--danger)':t.type==='income'?'var(--success)':'inherit'}">${t.type==='expense'?'−':t.type==='income'?'+':''}${money(t.amount,t.currency)}</td>
              <td>${statusBadge(t.status)}</td>
            </tr>`;
          }).join('')}
        </tbody></table>` : `<div class="empty"><h3>No ${scopeType?meta.title.toLowerCase():'transactions'} found</h3><p>Adjust your filters, or record ${scopeType?'the first one':"the company's first transaction"}.</p>
          <button class="btn btn-primary" id="emptyAdd">${ICONS('plus')} ${recordLabel}</button></div>`}
      </div>
      ${pageItems.length? `<div class="pagination" style="padding:12px 20px;">
        <span>${filtered.length} record${filtered.length!==1?'s':''} · page ${S.filters.page} of ${totalPages}</span>
        <div class="btns">
          <button class="btn btn-ghost btn-sm" id="prevPage" ${S.filters.page<=1?'disabled':''}>Previous</button>
          <button class="btn btn-ghost btn-sm" id="nextPage" ${S.filters.page>=totalPages?'disabled':''}>Next</button>
        </div>
      </div>` : ''}
    </div>
  `;
  const bind = (id,key)=>{ const el = $(id); if(el) el.onchange = e=>{ S.filters[key]=e.target.value; S.filters.page=1; renderTransactions(scopeType); }; };
  bind('#ftype','type'); bind('#fcat','category'); bind('#facc','account'); bind('#fbu','bu'); bind('#fstatus','status'); bind('#ffrom','from'); bind('#fto','to');
  $('#fq').oninput = debounce(e=>{ S.filters.q=e.target.value; S.filters.page=1; renderTransactions(scopeType); },250);
  const prevBtn=$('#prevPage'), nextBtn=$('#nextPage');
  if(prevBtn) prevBtn.onclick=()=>{ S.filters.page--; renderTransactions(scopeType); };
  if(nextBtn) nextBtn.onclick=()=>{ S.filters.page++; renderTransactions(scopeType); };
  $$('[data-tx]').forEach(row=> row.onclick = ()=> openTxDetail(row.dataset.tx));
  // The record modal opens ONLY from an explicit Add click — never from
  // simply arriving on a tab (that was the "transfer popup always opens"
  // bug: the old router opened a modal for every #/record/* hash on load).
  const qa = $('#quickAdd'); if(qa) qa.onclick = ()=> openRecordModal(addType);
  const ea = $('#emptyAdd'); if(ea) ea.onclick = ()=> openRecordModal(addType);
  const exp = $('#exportBtn'); if(exp) exp.onclick = ()=> exportCSV(filtered);
}

async function exportCSV(list){
  const header = ['Date','Voucher','Type','Party','Category','Business Unit','Account','Amount','Currency','Reference','Status','Description'];
  const rows = list.map(t=>{
    const cat = S.categories.find(c=>c.id===t.categoryId);
    const bu = S.businessUnits.find(b=>b.id===t.businessUnitId);
    const acc = S.accounts.find(a=>a.id===t.accountId);
    return [t.date,t.voucher,t.type,t.party||'',cat?cat.name:'',bu?bu.name:'',acc?acc.name:'',t.amount,t.currency||'BDT',t.reference||'',t.status,(t.description||'').replace(/[\r\n]+/g,' ')];
  });
  const csv = [header, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  await triggerDownload(`connectivo-finops-transactions-${todayISO()}.csv`, csv);
}

      <div style="font-size:12.5px; color:var(--ink-soft);">
        Recorded by ${esc(t.createdByName||'—')} on ${fmtDateTime(t.createdAt)}
        ${t.status==='voided'? `<br><span style="color:var(--danger); font-weight:600;">Voided by ${esc(t.voidedByName||'—')} on ${fmtDateTime(t.voidedAt)}</span><br>Reason: ${esc(t.voidReason||'—')}` : ''}
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="voucherPdfBtn">${ICONS('download')} Voucher PDF</button>
      ${S.me.role==='developer'? `<button class="btn btn-danger" id="deleteBtn">Delete Permanently</button>`:''}
      ${canVoid? `<button class="btn btn-danger" id="voidBtn">Void Transaction</button>`:''}
      <button class="btn btn-ghost" data-close>Close</button>
    </div>
  `);
  const vb = $('#voidBtn'); if(vb) vb.onclick = ()=> openVoidModal(t);
  const delBtn = $('#deleteBtn');
  if(delBtn) delBtn.onclick = ()=> openDangerConfirm({
    title:'Delete transaction permanently',
    message:`This removes <strong>${esc(t.voucher)}</strong> and its history entirely — unlike Void, this does not leave a record behind. Every other role (CEO, Admin) can only void, never hard-delete, for this exact reason.`,
    confirmPhrase: t.voucher,
    confirmLabel: 'Delete Permanently',
    onConfirm: async ()=>{
      await dbDelete('transactions', t.id);
      await logAudit('TRANSACTION_DELETED','transaction', t.id, `${t.voucher} permanently deleted.`, auditActorLabel());
      toast('Transaction deleted.', 'success');
      await refetchAll(); renderRoute();
    },
  });
  $('#voucherPdfBtn').onclick = async (e)=>{ e.target.disabled=true; e.target.textContent='Generating…'; try{ await downloadVoucherPdf(t); }catch(err){ toast('Unable to generate the PDF.', 'error'); } finally { e.target.disabled=false; e.target.innerHTML = ICONS('download')+' Voucher PDF'; } };

  const loadDocs = async ()=>{
    const all = docIds.length ? await Promise.all(docIds.map(did=>dbGetDoc('documents', did))) : [];
    const docs = all.filter(Boolean);
    const el = $('#txDocs'); if(el) el.innerHTML = attachmentListHtml(docs);
  };
  loadDocs();
  const attachInput = $('#txAttach');
  if(attachInput) attachInput.onchange = async ()=>{
    const file = attachInput.files[0]; if(!file) return;
    try{
      const newId = await uploadAttachment(file, t.id, t.voucher);
      const updated = [...docIds, newId];
      await dbUpdate('transactions', t.id, {documentIds: updated});
      await logAudit('DOCUMENT_UPLOADED','transaction', t.id, `${file.name} attached to ${t.voucher}`);
      toast('Document attached.', 'success');
      t.documentIds = updated;
      await refetchAll();
      loadDocs();
    }catch(err){ toast('Unable to attach that document.', 'error'); }
  };
}

function openVoidModal(t){
  showModal(`
    <div class="modal-head"><h3>Void ${esc(t.voucher)}</h3><button class="modal-close" data-close>${ICONS('x')}</button></div>
    <div class="modal-body">
      <p style="font-size:13px; color:var(--ink-soft); margin-top:0;">This transaction will be marked <strong>Voided</strong> and excluded from active totals. It remains permanently visible in history — this cannot be undone.</p>
      <div class="field"><label>Reason for voiding *</label><textarea id="voidReason" rows="3" placeholder="e.g. Duplicate transaction entered."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-danger" id="confirmVoid">Void Transaction</button>
    </div>
  `);
  $('#confirmVoid').onclick = async ()=>{
    const reason = $('#voidReason').value.trim();
    if(!reason){ toast('Please provide a reason.', 'error'); return; }
    try{
      await dbUpdate('transactions', t.id, {status:'voided', voidReason:reason, voidedBy:S.uid, voidedByName:S.me.name, voidedAt:new Date().toISOString()});
      await logAudit('TRANSACTION_VOIDED','transaction',t.id, `${t.voucher} voided: ${reason}`);
      closeModal(); toast('Transaction voided.', 'success');
      await refetchAll(); renderRoute();
    }catch(e){ toast('Unable to void transaction. No change was made.', 'error'); }
  };
}

/* ================= RECORD INCOME / EXPENSE / TRANSFER ================= */
function openRecordModal(type){
  const isIncome = type==='income', isExpense = type==='expense', isTransfer = type==='transfer';
  const cats = S.categories.filter(c=>c.kind===type);
  const catGroups = {};
  cats.forEach(c=>{ (catGroups[c.group]=catGroups[c.group]||[]).push(c); });
  const catOpts = Object.keys(catGroups).map(g=>`<optgroup label="${esc(g)}">${catGroups[g].map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
  const buOpts = S.businessUnits.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');
  const accOpts = S.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');

  showModal(`
    <div class="modal-head">
      <h3>Record ${isIncome?'Income':isExpense?'Expenditure':'Transfer'}</h3>
      <button class="modal-close" data-close>${ICONS('x')}</button>
    </div>
    <div class="modal-body">
      <div class="form-section-label">Basic Information</div>
      <div class="form-row">
        <div class="field"><label>Date *</label><input type="date" id="f_date" value="${todayISO()}"></div>
        ${!isTransfer? `<div class="field"><label>Business Unit</label><select id="f_bu"><option value="">—</option>${buOpts}</select></div>` : `<div class="field"><label>Reference</label><input id="f_ref" placeholder="Optional external reference"></div>`}
      </div>
      <div class="form-section-label">Financial Information</div>
      <div class="form-row">
        <div class="field"><label>Amount (BDT) *</label><input type="number" step="0.01" min="0" id="f_amount" placeholder="0.00"></div>
        ${isTransfer
          ? `<div class="field"><label>From Account *</label><select id="f_account">${accOpts}</select></div>`
          : `<div class="field"><label>Account *</label><select id="f_account">${accOpts}</select></div>`}
      </div>
      ${isTransfer? `<div class="field"><label>To Account *</label><select id="f_toaccount">${accOpts}</select></div>` : `
      <div class="form-row">
        <div class="field"><label>${isIncome?'Income':'Expense'} Category *</label><select id="f_cat"><option value="">Select category…</option>${catOpts}</select></div>
        <div class="field"><label>${isIncome?'Source / Client':'Payee / Vendor'}</label><input id="f_party" placeholder="${isIncome?'e.g. Arseas Security':'e.g. WPEngine'}"></div>
      </div>`}
      <div class="form-section-label">Documentation</div>
      ${!isTransfer? `<div class="field"><label>Reference Number</label><input id="f_ref" placeholder="e.g. RENT-SEP-2026"></div>`:''}
      <div class="field"><label>Supporting Document</label><input type="file" id="f_files" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.xlsx,.csv"><div class="hint">PDF, image or spreadsheet. Optional — you can also attach one later from the transaction detail.</div></div>
      <div class="form-section-label">Additional Information</div>
      <div class="field"><label>Description</label><textarea id="f_desc" rows="2" placeholder="Optional notes"></textarea></div>
      <div id="formErr" class="err" style="display:none;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" data-close>Cancel</button>
      <button class="btn btn-primary" id="submitTx">Record ${isIncome?'Income':isExpense?'Expenditure':'Transfer'}</button>
    </div>
  `);

  $('#submitTx').onclick = async ()=>{
    const date = $('#f_date').value;
    const amount = parseFloat($('#f_amount').value);
    const account = $('#f_account').value;
    const errEl = $('#formErr');
    const setErr = m=>{ errEl.textContent=m; errEl.style.display='block'; };
    if(!date) return setErr('Please choose a date.');
    if(!amount || amount<=0) return setErr('Please enter an amount greater than zero.');
    if(!account) return setErr('Please choose an account.');
    let toAccount, categoryId, party, businessUnitId;
    if(isTransfer){
      toAccount = $('#f_toaccount').value;
      if(!toAccount) return setErr('Please choose a destination account.');
      if(toAccount===account) return setErr('From and To accounts must be different.');
    } else {
      categoryId = $('#f_cat').value;
      if(!categoryId) return setErr(`Please choose a ${isIncome?'income':'expense'} category.`);
      party = $('#f_party').value.trim();
      businessUnitId = $('#f_bu').value;
    }
    errEl.style.display='none';
    $('#submitTx').disabled = true; $('#submitTx').textContent = 'Saving…';
    try{
      const voucher = await nextVoucher(type);
      const id = uuid();
      const payload = {
        voucher, type, date, amount, currency:'BDT', accountId:account,
        toAccountId: isTransfer? toAccount : null,
        categoryId: isTransfer? null : categoryId,
        businessUnitId: isTransfer? null : (businessUnitId||null),
        party: isTransfer? null : (party||null),
        reference: $('#f_ref')? $('#f_ref').value.trim() : '',
        description: $('#f_desc').value.trim(),
        status:'recorded', createdBy:S.uid, createdByName:S.me.name, createdAt:new Date().toISOString(),
      };
      await dbSet('transactions', id, payload);
      await logAudit('TRANSACTION_CREATED','transaction', id, `${voucher} — ${type} of ${money(amount)}${party?' ('+party+')':''}`);

      const fileInput = $('#f_files');
      if(fileInput && fileInput.files && fileInput.files.length){
        const ids = [];
        for(const file of Array.from(fileInput.files)){
          try{ ids.push(await uploadAttachment(file, id, voucher)); }
          catch(err){ console.error('attachment upload failed', err); toast(`${voucher} recorded, but "${file.name}" could not be attached.`, 'error'); }
        }
        if(ids.length){ try{ await dbUpdate('transactions', id, {documentIds: ids}); }catch(e){} }
      }

      closeModal();
      toast(`${voucher} recorded.`, 'success');
      await refetchAll();
      renderRoute();
    }catch(e){
      setErr('Unable to save transaction. No financial record was created. Please try again.');
      $('#submitTx').disabled=false; $('#submitTx').textContent = `Record ${isIncome?'Income':isExpense?'Expenditure':'Transfer'}`;
    }
  };
}

function renderCashbook(){

    let head, cashCol='', bankCol='';

      if(relevantAcc && relevantAcc.type==='cash') cashCol = money(t.amount);
      if(relevantAcc && relevantAcc.type==='bank') bankCol = money(t.amount);
    } else {
      head = esc(t.party||(cat?cat.name:'—'));

      if(acc && acc.type==='bank') bankCol = money(t.amount);

  }).join('');
  const sumCol = (list, type)=> list.filter(t=>{
    if(t.type!=='transfer') return (S.accounts.find(a=>a.id===t.accountId)||{}).type===type;
    return true;
  }).reduce((s,t)=>{
    const acc = S.accounts.find(a=>a.id===t.accountId), toAcc = S.accounts.find(a=>a.id===t.toAccountId);
    if(t.type!=='transfer') return s + (acc&&acc.type===type? Number(t.amount):0);
    return s;
  },0);

  $('#content').innerHTML = `
    <div style="margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">

function renderUsers(){

  const others = ACCOUNTS.filter(a=>a.role!=='developer' && a.uid!==S.uid);
  const statusFor = uid => (S.roles.find(r=>r.id===uid)||{}).status || 'active';
  const lastSeenFor = uid => { const r = S.roles.find(x=>x.id===uid); return r && r.addedAt ? fmtDate(r.addedAt.slice(0,10)) : 'Never signed in'; };
  const roleLabel = r => r==='ceo'?'CEO':r==='developer'?'Developer':'Admin / Accounts Officer';

  $('#content').innerHTML = `
    <div class="lockbar" style="background:var(--info-bg); color:var(--primary-700);">${
      S.mode==='claude' ? "Sign-in uses fixed company credentials, checked in this page. Suspending an account here blocks that person's access immediately, on top of claude.ai's own sharing permissions." :
      S.mode==='netlify' ? "Sign-in is verified server-side by this site's own Netlify Functions. Suspending an account here blocks that person's access immediately, even with a valid password." :
      "Running without the Netlify Functions backend deployed: sign-in still uses the same fixed credentials, but data is only stored in this browser."}</div>
    <div class="card">
      <div class="card-pad viewport-narrow" style="padding-top:6px;">
        <table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last Sign-in</th><th></th></tr></thead><tbody>
          <tr style="cursor:default;"><td>${esc(S.me.name)} (you)</td><td>${roleLabel(S.me.role)}</td><td><span class="badge badge-recorded">Active</span></td><td>Now</td><td></td></tr>
          ${others.map(a=>{
            const status = statusFor(a.uid);
            return `<tr style="cursor:default;">
              <td>${esc(a.name)}</td>
              <td>${roleLabel(a.role)}</td>
              <td>${status==='suspended'? '<span class="badge badge-voided">Suspended</span>' : '<span class="badge badge-recorded">Active</span>'}</td>
              <td>${lastSeenFor(a.uid)}</td>
              <td><button class="btn btn-ghost btn-sm" data-tog="${a.uid}">${status==='suspended'?'Reactivate':'Suspend'}</button></td>
            </tr>`;
          }).join('')}
        </tbody></table>
      </div>
    </div>
    <p style="font-size:12px; color:var(--ink-soft); margin-top:12px;">Suspending someone does not remove their historical records — past transactions keep their original author's name.</p>
  `;
  $$('[data-tog]').forEach(b=> b.onclick = async ()=>{
    const uid = b.dataset.tog;
    const acct = ACCOUNTS.find(a=>a.uid===uid);
    const current = statusFor(uid);
    const next = current==='suspended' ? 'active' : 'suspended';
    try{
      const existing = await dbGetDoc('roles', uid);
      if(existing) await dbUpdate('roles', uid, {status:next});
      else await dbSet('roles', uid, {name:acct.name, role:acct.role, status:next, addedAt:new Date().toISOString()});
      await logAudit(next==='suspended'?'USER_SUSPENDED':'USER_REACTIVATED','user',uid, acct.name);
      toast(next==='suspended'?'Account suspended.':'Account reactivated.', 'success'); await refetchAll(); renderRoute();
    }catch(err){ toast('Unable to update status.', 'error'); }
  });
}

/* ================= BRANDED PDF GENERATION ================= */
// jsPDF is loaded from cdnjs (see <head>). All PDFs share one branded
// header/footer so every statement, report and voucher looks like the
// same official Connectivo document, per the spec's PDF design rules.
const PDF = {
  W: 210, H: 297, margin: 14, // A4, mm
  new(){ const { jsPDF } = window.jspdf; return new jsPDF({unit:'mm', format:'a4'}); },
  header(doc, title, subtitle){
    const m = this.margin;
    // Logo's true aspect ratio is ~1.98:1 (686x346 after cropping its
    // transparent padding) — the previous 46x12.2 box distorted it badly
    // (squished ~3.8:1), which is why the PDF logo looked "fabricated".
    try{ doc.addImage(window.__LOGO_FULL__, 'PNG', m, 9, 34, 17.15); }catch(e){}
    doc.setTextColor(21,27,35);
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text(title, this.W-m, 15, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.setTextColor(87,97,109);
    if(subtitle) doc.text(subtitle, this.W-m, 20.5, {align:'right'});
    doc.text(`Generated ${fmtDateTime(new Date().toISOString())} · Prepared by ${S.me.name||'—'}`, this.W-m, 25.5, {align:'right'});
    doc.setDrawColor(226,231,236); doc.setLineWidth(0.4);
    doc.line(m, 31, this.W-m, 31);
    doc.setTextColor(21,27,35);
    return 39; // next content Y
  },
  footer(doc, pageNum, totalPages){
    const m = this.margin;
    doc.setDrawColor(226,231,236); doc.line(m, this.H-14, this.W-m, this.H-14);
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(137,147,160);
    doc.text('Confidential — Connectivo Internal Financial Record', m, this.H-9);
    doc.text(`Page ${pageNum}${totalPages?(' of '+totalPages):''}`, this.W-m, this.H-9, {align:'right'});
  },
  /** Draws a simple bordered table starting at startY, paginating with the
   * same branded header/footer when content runs past the page. Returns
   * the Y position after the table. */
  table(doc, {title, subtitle, startY, columns, rows}){
    const m = this.margin;
    let y = startY;
    const drawHeaderRow = ()=>{
      doc.setFillColor(10,61,92); doc.setTextColor(255,255,255);
      doc.rect(m, y, this.W-2*m, 7, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
      let x = m+2;
      columns.forEach(c=>{ doc.text(c.label, x + (c.align==='right'? c.width-4:0), y+4.8, {align:c.align==='right'?'right':'left'}); x += c.width; });
      doc.setTextColor(21,27,35);
      y += 7;
    };
    if(title){ doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text(title, m, y); y += 5; }
    if(subtitle){ doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(87,97,109); doc.text(subtitle, m, y); doc.setTextColor(21,27,35); y += 6; }
    drawHeaderRow();
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    let pageNum = 1;
    rows.forEach((row, i)=>{
      if(y > this.H - 24){
        this.footer(doc, pageNum);
        doc.addPage(); pageNum++;
        y = this.header(doc, title||'', subtitle||'');
        drawHeaderRow();
      }
      if(i%2===1){ doc.setFillColor(250,251,252); doc.rect(m, y, this.W-2*m, 6.4, 'F'); }
      let x = m+2;
      columns.forEach((c,ci)=>{
        const val = String(row[ci] ?? '');
        doc.text(val, x + (c.align==='right'? c.width-4:0), y+4.4, {align:c.align==='right'?'right':'left', maxWidth:c.width-4});
        x += c.width;
      });
      y += 6.4;
    });
    doc.setDrawColor(226,231,236); doc.line(m, y, this.W-m, y);
    return y + 4;
  },
  async download(doc, filename){
    const blob = doc.output('blob');
    await triggerDownload(filename, blob);
  }
};

function finalizePdf(doc, title, subtitle, pageCountHint){
  // stamp footer with correct total page count across every page
  const total = doc.internal.getNumberOfPages();
  for(let p=1;p<=total;p++){ doc.setPage(p); PDF.footer(doc, p, total); }
}

async function downloadVoucherPdf(t){
  const doc = PDF.new();
  let y = PDF.header(doc, 'CONNECTIVO FINOPS', 'Financial Operations & Control');
  const cat = S.categories.find(c=>c.id===t.categoryId);
  const bu = S.businessUnits.find(b=>b.id===t.businessUnitId);
  const acc = S.accounts.find(a=>a.id===t.accountId);
  const toAcc = S.accounts.find(a=>a.id===t.toAccountId);
  const kindLabel = t.type==='income'?'Receipt Voucher':t.type==='expense'?'Payment Voucher':'Transfer Voucher';

  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text(kindLabel, PDF.margin, y+6);
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(14,107,168);
  doc.text(t.voucher, PDF.margin, y+15);
  doc.setTextColor(21,27,35);
  y += 24;

  const rows = [
    ['Date', fmtDate(t.date)],
    ['Type', t.type.charAt(0).toUpperCase()+t.type.slice(1)],
    ['Amount', money(t.amount, t.currency)],
  ];
  if(t.type==='transfer'){ rows.push(['From Account', acc?acc.name:'—'], ['To Account', toAcc?toAcc.name:'—']); }
  else { rows.push(['Account', acc?acc.name:'—'], ['Category', cat?cat.name:'Uncategorized'], [t.type==='income'?'Source':'Payee', t.party||'—']); }
  if(bu) rows.push(['Business Unit', bu.name]);
  rows.push(['Reference No.', t.reference||'—'], ['Description', t.description||'—'], ['Status', t.status==='voided'?'VOIDED':'Recorded'], ['Recorded By', t.createdByName||'—'], ['Recorded At', fmtDateTime(t.createdAt)]);
  if(t.status==='voided') rows.push(['Void Reason', t.voidReason||'—'], ['Voided By', `${t.voidedByName||'—'} on ${fmtDateTime(t.voidedAt)}`]);

  doc.setFontSize(10);
  rows.forEach(([k,v])=>{
    doc.setFont('helvetica','bold'); doc.setTextColor(87,97,109); doc.text(k, PDF.margin, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(21,27,35);
    doc.text(String(v), PDF.margin+48, y, {maxWidth:PDF.W-PDF.margin-48-PDF.margin});
    y += 7;
  });

  y += 10;
  doc.setDrawColor(205,212,220);
  const sigW = (PDF.W-2*PDF.margin-16)/3;
  ['Prepared By','Reviewed By','Approved By'].forEach((label,i)=>{
    const x = PDF.margin + i*(sigW+8);
    doc.line(x, y, x+sigW, y);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(137,147,160);
    doc.text(label, x, y+4.5);
  });

  finalizePdf(doc);
  await PDF.download(doc, `${t.voucher}.pdf`);

async function downloadCashbookPdf(){
  const per = S.reportPeriod==='all'? {from:null,to:null,label:'All Time'} : periodRange(S.reportPeriod);
  const inRange = t=> (!per.from||t.date>=per.from) && (!per.to||t.date<=per.to) && t.status!=='voided';
  const toRow = (t, isReceipt)=>{
    const cat = S.categories.find(c=>c.id===t.categoryId);
    const acc = S.accounts.find(a=>a.id===t.accountId), toAcc = S.accounts.find(a=>a.id===t.toAccountId);
    let head, cash='', bank='';
    if(t.type==='transfer'){
      head = `Transfer: ${acc?acc.name:''} -> ${toAcc?toAcc.name:''}`;
      const relevant = isReceipt? toAcc : acc;
      if(relevant && relevant.type==='cash') cash = money(t.amount);
      if(relevant && relevant.type==='bank') bank = money(t.amount);
    } else {
      head = t.party || (cat?cat.name:'—');
      if(acc && acc.type==='cash') cash = money(t.amount);
      if(acc && acc.type==='bank') bank = money(t.amount);
    }
    return [fmtDate(t.date), head, t.reference||'—', t.voucher, cash, bank];
  };
  const received = S.transactions.filter(t=>inRange(t) && (t.type==='income'||t.type==='transfer')).sort((a,b)=>a.date.localeCompare(b.date)).map(t=>toRow(t,true));
  const paid = S.transactions.filter(t=>inRange(t) && (t.type==='expense'||t.type==='transfer')).sort((a,b)=>a.date.localeCompare(b.date)).map(t=>toRow(t,false));
  const cols = [{label:'Date',width:22},{label:'Head of Account',width:56},{label:'Ref',width:26},{label:'Voucher',width:30},{label:'Cash',width:24,align:'right'},{label:'Bank',width:24,align:'right'}];

  const doc = PDF.new();
  let y = PDF.header(doc, 'Cash & Bank Book', per.label);
  y = PDF.table(doc, {title:'Debit / Received', startY:y, columns:cols, rows:received});
  y += 6;
  if(y > PDF.H - 60){ PDF.footer(doc, doc.internal.getNumberOfPages()); doc.addPage(); y = PDF.header(doc,'Cash & Bank Book', per.label); }
  PDF.table(doc, {title:'Credit / Payment', startY:y, columns:cols, rows:paid});
  finalizePdf(doc);
  await PDF.download(doc, `connectivo-cashbook-${todayISO()}.pdf`);
}

async function uploadAttachment(file, transactionId, voucher){
  if(S.mode==='claude'){
    const assets = await claude.use('assets');
    if(!assets) throw new Error('Document storage is unavailable in this view.');
    const res = await assets.upload(file, {});
    await dbSet('documents', res.id, {
      name: file.name, contentType: res.contentType||file.type, sizeBytes: res.sizeBytes||file.size,
      transactionId: transactionId||null, voucher: voucher||null,
      uploadedBy: S.uid, uploadedByName: S.me.name, uploadedAt: new Date().toISOString(),
    });
    return res.id;
  }
  if(S.mode==='netlify'){
    const NETLIFY_ATTACHMENT_CAP = 4*1024*1024;
    if(file.size > NETLIFY_ATTACHMENT_CAP) throw new Error('Files over 4 MB are not supported. Please attach a smaller file.');
    const dataUrl = await fileToBase64(file);
    const base64 = dataUrl.split(',')[1];
    const res = await fetch('/api/upload', {
      method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({filename:file.name, contentType:file.type, dataBase64:base64}),
    });
    const json = await res.json().catch(()=>({}));
    if(!res.ok || !json.ok) throw new Error(json.error || 'Upload failed.');
    await dbSet('documents', json.id, {
      name: file.name, contentType: file.type||'application/octet-stream', sizeBytes: file.size,
      transactionId: transactionId||null, voucher: voucher||null,
      uploadedBy: S.uid, uploadedByName: S.me.name, uploadedAt: new Date().toISOString(),
    });
    return json.id;
  }
  // Standalone fallback: no asset store outside claude.ai, so the file is
  // kept as a data: URL inside the local document record. Capped well
  // under typical localStorage quotas (5–10 MB total per origin).
  const LOCAL_ATTACHMENT_CAP = 2*1024*1024;
  if(file.size > LOCAL_ATTACHMENT_CAP){
    throw new Error(`Files over 2 MB aren't supported when running outside claude.ai (this browser's local storage is limited). Open this app's claude.ai link for full-size document storage.`);
  }
  const dataUrl = await fileToBase64(file);
  const id = uuid();
  await dbSet('documents', id, {
    name: file.name, contentType: file.type||'application/octet-stream', sizeBytes: file.size,
    transactionId: transactionId||null, voucher: voucher||null,
    uploadedBy: S.uid, uploadedByName: S.me.name, uploadedAt: new Date().toISOString(),
    localData: dataUrl,
  });
  return id;
}

function attachmentHref(d){
  if(d.localData) return d.localData;
  if(S.mode==='netlify') return '/api/file?id='+encodeURIComponent(d.id);
  return '/_blob/'+d.id;
}

/* ================= STANDALONE (non-claude.ai) FALLBACK ================= */
// This file is also meant to be downloaded and hosted on the person's own
// static host (Netlify, GitHub Pages, ...). Outside claude.ai there is no
// window.claude, so none of the db/user/assets/downloads capabilities
// exist. createLocalDb() implements the same minimal surface our code
// calls (collection().limit().get(), doc().get()/set()/update()) backed by
// localStorage, so every screen keeps working — with the honest trade-off
// that data then lives only in that one browser, on that one device, with
// no real access control. We tell the person this plainly in the gate.
const LOCAL_DB_KEY = 'connectivo_finops_local_db_v1';
function createLocalDb(){
  const readAll = ()=>{ try{ return JSON.parse(localStorage.getItem(LOCAL_DB_KEY)||'{}'); }catch(e){ return {}; } };
  const writeAll = obj => localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(obj));
  return {
    collection(name){
      return {
        limit(){ return this; },
        async get(){
          const all = (readAll()[name]) || {};
          const docs = Object.keys(all).map(id=>({id, exists:true, data:()=>all[id]}));
          return {docs};
        },
      };
    },
    doc(path){
      const parts = path.split('/'); const name = parts[0], id = parts[1];
      return {
        id,
        async get(){
          const all = (readAll()[name]) || {};
          const exists = Object.prototype.hasOwnProperty.call(all, id);
          return {id, exists, data: ()=> exists ? all[id] : undefined};
        },
        async set(data){
          const all = readAll(); all[name] = all[name] || {};
          all[name][id] = JSON.parse(JSON.stringify(data));
          writeAll(all);
        },
        async update(data){
          const all = readAll(); all[name] = all[name] || {};
          if(!Object.prototype.hasOwnProperty.call(all[name], id)) throw {code:'invalid_argument', message:'document does not exist'};
          all[name][id] = {...all[name][id], ...JSON.parse(JSON.stringify(data))};
          writeAll(all);
        },
        async delete(){ const all = readAll(); if(all[name]) delete all[name][id]; writeAll(all); },
      };
    },
  };
}
/** Real backend mode: when this file is deployed on Netlify alongside the
 * netlify/functions in this package, every read/write goes through those
 * authenticated Functions instead of claude.ai's capabilities or
 * localStorage. This shim exposes the exact same collection()/doc()
 * shape as createLocalDb(), so none of the rest of the app needs to know
 * which backend it's talking to. */
function createNetlifyDb(){
  async function callData(payload){
    const res = await fetch('/api/data', {
      method:'POST', credentials:'include',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    let json = null;
    try{ json = await res.json(); }catch(e){}
    if(res.status===401) throw {code:'not_signed_in', message:(json&&json.error)||'Session expired.'};
    if(!res.ok) throw {code:'server_error', message:(json&&json.error)||'Request failed.'};
    return json || {};
  }
  const stripId = d => { const {id, ...rest} = d; return rest; };
  return {
    collection(name){
      return {
        limit(){ return this; },
        async get(){
          const r = await callData({op:'list', collection:name});
          const docs = (r.docs||[]).map(d=>({id:d.id, exists:true, data:()=>stripId(d)}));
          return {docs};
        },
      };
    },
    doc(path){
      const [name, id] = path.split('/');
      return {
        id,
        async get(){
          const r = await callData({op:'get', collection:name, id});
          const doc = r.doc;
          return {id, exists: !!doc, data: ()=> doc ? stripId(doc) : undefined};
        },
        async set(data){ await callData({op:'set', collection:name, id, data}); },
        async update(data){ await callData({op:'update', collection:name, id, data}); },
        async delete(){ await callData({op:'delete', collection:name, id}); },
      };
    },
  };
}
/** Probes for the Netlify Functions backend from this same package. A
 * plain static deploy (no functions/env vars configured) will 404 here
 * and the app quietly falls back to local-storage mode instead of
 * breaking — same file works either way. */
async function detectNetlifyFunctions(){
  try{
    const res = await fetch('/api/auth/session', {credentials:'include'});
    if(res.status===404) return false;
    const data = await res.json().catch(()=>null);
    return !!data && (typeof data.ok !== 'undefined' || typeof data.error !== 'undefined');
  }catch(e){ return false; }
}

/** Unified file-save: uses the claude.ai downloads capability (a plain
 * <a download> is inert inside the published artifact's sandboxed frame)
 * when available, and a normal browser download otherwise (which is what
 * runs once this file is self-hosted). */
async function triggerDownload(filename, data){
  if(S.mode==='claude'){
    try{
      const dl = await claude.use('downloads');
      if(dl){ await dl.save({filename, data}); toast('Download ready — check your downloads.', 'success'); return; }
    }catch(e){ console.error('downloads capability failed', e); }
  }
  const blob = (data instanceof Blob) ? data : new Blob([data]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
    r.readAsDataURL(file);
  });
}

/* ================= CREDENTIAL LOGIN =================
 * IMPORTANT, READ THIS: this app is a single static HTML/JS file with no
 * server. There is NO way for client-side code to keep a secret truly
 * secret — anyone who has the file (view-source, browser devtools, or the
 * GitHub repo it's pushed to) can read everything below. Passwords are
 * stored as salted SHA-256 hashes rather than plaintext, which stops a
 * casual glance from revealing them outright, but it is NOT cryptographic
 * security: a hash is reversible-by-brute-force offline, and there is no
 * rate limiting because there is no server to enforce one. Treat this as
 * a locked office door, not a bank vault — it keeps out people who don't
 * have the credentials, not a determined technical attacker with the file
 * in hand. The claude.ai-hosted copy of this app has a real, independent
 * security layer on top of this (claude.ai's own account + sharing
 * permissions on who can even open the link at all); the self-hosted
 * static copy relies on this login ALONE, which is materially weaker.
 */
const ACCOUNTS = [
  {username:'shanto',  hash:'7cd2f1c4fd6cfc3ff3c2b95330d6313bb241654ed19e97504a85d3284c446775', role:'developer', name:'Shanto',  uid:'user-shanto'},
  {username:'shomvob', hash:'7c1c51c400ed32181b1f1e5bd3cf8eb1aa8b66941d7594d2c538134df9b9ea8f', role:'ceo',       name:'Shomvob', uid:'user-shomvob'},
  {username:'shoikot', hash:'21b0733df511c6b07c6aa55706622bbfcb8591bb3c8775c6e028b979118ab794', role:'admin',     name:'Shoikot', uid:'user-shoikot'},
];
const SESSION_KEY = 'connectivo_finops_session_v1';
async function sha256Hex(str){
  if(!(window.crypto && window.crypto.subtle)){
    // Web Crypto needs a secure context (https:// or localhost). Opening
    // the downloaded file directly as file:// can land here in some
    // browsers — surface it plainly instead of failing silently.
    throw new Error('SECURE_CONTEXT_REQUIRED');
  }
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function checkCredentials(username, password){
  const u = (username||'').trim().toLowerCase();
  const acct = ACCOUNTS.find(a=>a.username===u);
  if(!acct) { await sha256Hex('dummy-timing-equalizer'); return null; } // still hash something so a bad username doesn't respond measurably faster
  const salt = 'connectivo-finops::' + acct.username;
  const hash = await sha256Hex(salt + '::' + (password||''));
  return hash === acct.hash ? acct : null;
}

        : "Running without the Netlify Functions backend deployed: this sign-in has no server behind it, so treat it as a basic deterrent, not real security."}</p>

  const submit = async ()=>{

async function init(){
  // Connect to storage first — claude.ai's shared db, this package's own
  // Netlify Functions + Blobs backend if it's deployed and reachable, or
  // the local-storage fallback as a last resort. Independent of login.
  let dbCap = null;
  if(window.claude){
    try{ await claude.use('user'); }catch(e){}
    try{ dbCap = await claude.use('db'); }catch(e){}
  }
  if(dbCap){ S.mode = 'claude'; S.db = dbCap; }
  else if(await detectNetlifyFunctions()){ S.mode = 'netlify'; S.db = createNetlifyDb(); }
  else { S.mode = 'local'; S.db = createLocalDb(); }

  const afterLogin = async ()=>{
    await refetchAll();
    await seedIfEmpty();
    await refetchAll();
    // Per-account status doc (CEO/Developer can suspend Admin's access,
    // etc.) — independent of the fixed username/password/role table.
    let statusDoc = await dbGetDoc('roles', S.uid);
    if(!statusDoc){
      statusDoc = {name:S.me.name, role:S.me.role, status:'active', addedAt:new Date().toISOString()};
      try{ await dbSet('roles', S.uid, statusDoc); }catch(e){}
    }
    if(statusDoc.status==='suspended'){
      gateShell(`
        <h2 style="margin-bottom:8px; font-size:18px;">Access suspended</h2>
        <p style="color:var(--ink-soft); font-size:13.5px;">Your access to Connectivo FinOps has been suspended by a CEO-level user. Contact your CEO to restore access.</p>
      `);
      return;
    }
    // Keep the developer role's activity out of the audit trail that CEO
    // and Admin read, per the request that they don't need visibility
    // into that account's existence.
    if(S.me.role !== 'developer'){
      await logAudit('USER_LOGIN','user',S.uid, `${S.me.name} signed in.`);
    }
    await refetchAll();
    S.ready = true;
    renderRoute();
  };

  if(S.mode==='netlify'){
    // The httpOnly session cookie itself is the "remember me" — no
    // sessionStorage needed, and it survives a full reload or new tab
    // until it actually expires (8 hours) or is explicitly signed out.
    try{
      const res = await fetch('/api/auth/session', {credentials:'include'});
      if(res.ok){
        const data = await res.json();
        S.uid = data.uid; S.me.name = data.name; S.me.role = data.role;
        await afterLogin();
        return;
      }
    }catch(e){}
    renderLoginGate(afterLogin, true);
    return;
  }

  // claude / local modes: a same-tab sessionStorage flag skips re-typing
  // the password on every hash change or accidental reload, without ever
  // persisting it across a fresh visit.
  let resumed = null;
  try{ resumed = JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null'); }catch(e){}
  if(resumed && resumed.uid){
    const acct = ACCOUNTS.find(a=>a.uid===resumed.uid);
    if(acct){ S.uid = acct.uid; S.me.name = acct.name; S.me.role = acct.role; await afterLogin(); return; }
  }
  renderLoginGate(afterLogin, false);
}
init();

</script>
</body>
</html>
